<header class="barra">
  <a class="logo" routerLink="/publicaciones" (click)="menuAbierto.set(false)">
    <app-locomotora class="logo-loco" />
    La Trochita
  </a>

  <button
    type="button"
    class="hamburguesa"
    aria-label="Abrir o cerrar el menú"
    [attr.aria-expanded]="menuAbierto()"
    (click)="menuAbierto.set(!menuAbierto())"
  >
    ☰
  </button>

  <div class="enlaces" [class.abierto]="menuAbierto()">
    <!-- Cada sección es una estación sobre la vía; la locomotora está parada en la actual (E1) -->
    <nav class="linea" aria-label="Principal">
      <a
        class="estacion"
        routerLink="/publicaciones"
        routerLinkActive="activo"
        #rlaPublicaciones="routerLinkActive"
        (click)="menuAbierto.set(false)"
      >
        Publicaciones
        @if (rlaPublicaciones.isActive) {
          <app-locomotora class="tren" />
        }
      </a>
      <a
        class="estacion"
        routerLink="/perfil"
        routerLinkActive="activo"
        #rlaPerfil="routerLinkActive"
        (click)="menuAbierto.set(false)"
      >
        Mi perfil
        @if (rlaPerfil.isActive) {
          <app-locomotora class="tren" />
        }
      </a>
    </nav>

    @if (usuario(); as u) {
      <span class="usuario">
        <app-avatar [usuario]="u" [tamano]="32" />
        {{ u.nombreUsuario }}
        @if (u.perfil === 'administrador') {
          <!-- Insignia del administrador (E5): gorra de jefe de estación -->
          <span class="insignia">
            <svg viewBox="0 0 22 18" aria-hidden="true">
              <path d="M2 11 Q11 1 20 11 Z" />
              <rect class="visera" x="1" y="11" width="20" height="3" rx="1.5" />
              <rect x="5" y="14" width="15" height="2" rx="1" />
            </svg>
            Administrador
          </span>
        }
      </span>
    }
    <button type="button" class="btn btn-ocre" (click)="cerrarSesion()">Cerrar sesión</button>
  </div>
</header>
