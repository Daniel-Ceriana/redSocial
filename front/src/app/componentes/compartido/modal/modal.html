@if (modal.estado(); as m) {
  <div class="fondo" (click)="modal.cancelar()">
    <div
      class="ventana"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
      (click)="$event.stopPropagation()"
    >
      <h2 id="modal-titulo">{{ m.titulo }}</h2>
      @let mensajes = m.mensajes();
      @if (mensajes.length === 1) {
        <p>{{ mensajes[0] }}</p>
      } @else {
        <ul>
          @for (mensaje of mensajes; track $index) {
            <li>{{ mensaje }}</li>
          }
        </ul>
      }
      <div class="acciones">
        @for (opcion of m.opciones; track $index) {
          <button
            type="button"
            class="btn"
            [class.btn-secundario]="opcion.estilo === 'secundario'"
            [class.btn-peligro]="opcion.estilo === 'peligro'"
            [attr.autofocus]="$last ? '' : null"
            (click)="modal.cerrar(opcion.valor)"
          >
            {{ opcion.texto }}
          </button>
        }
      </div>
    </div>
  </div>
}
