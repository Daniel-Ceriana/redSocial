@if (modal.estado(); as m) {
  <div class="fondo" (click)="modal.cerrar(false)">
    <div
      class="ventana"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-titulo"
      (click)="$event.stopPropagation()"
    >
      <h2 id="modal-titulo">{{ m.titulo }}</h2>
      @if (m.mensajes.length === 1) {
        <p>{{ m.mensajes[0] }}</p>
      } @else {
        <ul>
          @for (mensaje of m.mensajes; track $index) {
            <li>{{ mensaje }}</li>
          }
        </ul>
      }
      <div class="acciones">
        @if (m.conCancelar) {
          <button type="button" class="btn btn-secundario" (click)="modal.cerrar(false)">
            Cancelar
          </button>
        }
        <button type="button" class="btn" autofocus (click)="modal.cerrar(true)">
          {{ m.conCancelar ? 'Aceptar' : 'Entendido' }}
        </button>
      </div>
    </div>
  </div>
}
